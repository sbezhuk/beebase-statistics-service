openapi: 3.0.3
info:
  title: BeeBase Statistics Service API
  description: >
    Dashboard/statistics aggregation service for BeeBase, an open-source
    backend for a beekeeper management application split into
    microservices. Access tokens are issued by auth-service (see its
    OpenAPI spec); this service verifies them against auth-service's
    public key and never trusts a userID from anywhere but a verified
    token.

    This service holds no data of its own. Every endpoint fetches the
    caller's apiaries, hives, inspections, and harvest records from
    apiary-service, hive-service, inspection-service, and
    harvest-service (forwarding the caller's own access token to each)
    and computes statistics fresh from that snapshot - there is no cache
    and nothing here is ever stale or mocked.
  version: 0.8.0
servers:
  - url: http://localhost:8080

tags:
  - name: system
    description: Liveness and readiness probes.
  - name: statistics
    description: Dashboard statistics computed from a user's own apiaries, hives, inspections, and harvest records.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      description: >
        This service has no database or other local dependency of its
        own to probe, so it's identical to /health.
      security: []
      responses:
        "200":
          description: The process is ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /api/v1/statistics/overview:
    get:
      tags: [statistics]
      summary: The Dashboard's top-level summary
      description: >
        Fetches the caller's entire apiary, hive, and inspection
        collections and computes every headline number in one pass.
      responses:
        "200":
          description: The caller's overview statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: A required upstream service (apiary/hive/inspection-service) failed or was unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/statistics/apiaries:
    get:
      tags: [statistics]
      summary: The Dashboard's apiary-focused section
      description: >
        Does not fetch the caller's inspections - only apiaries and hives
        are needed for this section.
      responses:
        "200":
          description: The caller's apiary statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiaryStatsResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: A required upstream service (apiary/hive-service) failed or was unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/statistics/inspections:
    get:
      tags: [statistics]
      summary: The Dashboard's inspection-focused section
      responses:
        "200":
          description: The caller's inspection statistics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionStatsResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: A required upstream service (apiary/hive/inspection-service) failed or was unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/statistics/activity:
    get:
      tags: [statistics]
      summary: The Dashboard's Recent Activity feed
      description: The caller's most recent inspections, newest first.
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return.
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: The caller's most recent inspections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResponse" }
        "400":
          description: limit is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: A required upstream service (apiary/hive/inspection-service) failed or was unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/statistics/harvest:
    get:
      tags: [statistics]
      summary: The Dashboard's harvest-focused section
      description: >
        Fetches the caller's hives, then every harvest record across
        them from harvest-service. A caller with no harvest records yet
        gets a "200" with total_harvests 0, an empty
        total_amount_by_unit, and null latest fields - not an error -
        distinguishable from a failed request, which returns "500"
        instead.
      responses:
        "200":
          description: The caller's harvest statistics, possibly empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HarvestStatsResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: A required upstream service (hive/harvest-service) failed or was unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/statistics/needs-attention:
    get:
      tags: [statistics]
      summary: The Dashboard's actionable "Needs Attention" section
      description: >
        Counts of apiaries and hives that currently need the caller's
        attention, plus the configured inspection warning threshold
        behind the hive count - the client reads the threshold from
        here rather than hardcoding or duplicating it. An apiary needs
        attention the instant it has zero hives, with no grace period
        based on its age. A hive needs attention when it's never been
        inspected, or its latest inspection is older than
        inspection_warning_threshold_days; the comparison is date-based
        (UTC calendar dates), so a hive inspected exactly on the
        threshold is still OK. This is the same rule, and the same
        configured threshold, that GET /api/v1/hives?needs_inspection=true
        on hive-service applies - the two are always consistent.
      responses:
        "200":
          description: The caller's Needs Attention counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NeedsAttentionResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "500":
          description: A required upstream service (apiary/hive/inspection-service) failed or was unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by auth-service's /api/v1/auth/login (or /register or /refresh).

  schemas:
    StatusResponse:
      type: object
      properties:
        status: { type: string, example: ok }

    OverviewResponse:
      type: object
      properties:
        totalApiaries: { type: integer }
        totalHives: { type: integer }
        totalInspections: { type: integer }
        inspectionsLast7Days: { type: integer }
        inspectionsThisMonth: { type: integer }
        inspectionsThisYear: { type: integer }
        apiariesWithoutHives: { type: integer }
        latestInspectionAt:
          type: string
          format: date-time
          nullable: true
          description: Null when the caller has no inspections yet.

    ApiaryHiveCount:
      type: object
      properties:
        apiaryId: { type: string, format: uuid }
        name: { type: string }
        hiveCount: { type: integer }

    ApiaryStatsResponse:
      type: object
      properties:
        totalApiaries: { type: integer }
        apiariesWithoutHives: { type: integer }
        apiaryWithMostHives:
          allOf: [{ $ref: "#/components/schemas/ApiaryHiveCount" }]
          nullable: true
          description: Null when the caller has no hives at all.
        hiveDistribution:
          type: array
          items: { $ref: "#/components/schemas/ApiaryHiveCount" }
          description: Covers every apiary, sorted by hive count descending - ready to render as a chart.

    HiveInspectionCount:
      type: object
      properties:
        hiveId: { type: string, format: uuid }
        hiveName: { type: string }
        apiaryId: { type: string, format: uuid }
        apiaryName: { type: string }
        inspectionCount: { type: integer }

    DayCount:
      type: object
      properties:
        date: { type: string, example: "2026-03-15" }
        count: { type: integer }

    InspectionStatsResponse:
      type: object
      properties:
        totalInspections: { type: integer }
        inspectionsLast7Days: { type: integer }
        inspectionsThisMonth: { type: integer }
        inspectionsThisYear: { type: integer }
        hiveWithMostInspections:
          allOf: [{ $ref: "#/components/schemas/HiveInspectionCount" }]
          nullable: true
          description: Null when the caller has no inspections yet.
        latestInspectionAt:
          type: string
          format: date-time
          nullable: true
        activityLast30Days:
          type: array
          items: { $ref: "#/components/schemas/DayCount" }
          description: Always exactly 30 entries, oldest to newest ending today (UTC), zero-filled for days with no inspections.

    ActivityItem:
      type: object
      properties:
        inspectionId: { type: string, format: uuid }
        inspectedAt: { type: string, format: date-time }
        hiveId: { type: string, format: uuid }
        hiveName: { type: string }
        apiaryId: { type: string, format: uuid }
        apiaryName: { type: string }
        notes: { type: string }

    ActivityResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }

    HarvestAmountByUnit:
      type: object
      properties:
        unit: { type: string, example: kg }
        total: { type: number, format: double }

    HarvestStatsResponse:
      type: object
      properties:
        totalHarvests: { type: integer }
        totalAmountByUnit:
          type: array
          items: { $ref: "#/components/schemas/HarvestAmountByUnit" }
          description: >
            One entry per unit present in the caller's harvest records -
            amounts are only ever summed within the same unit, never
            combined across units. Empty when total_harvests is 0.
        latestHarvestedAt:
          type: string
          format: date-time
          nullable: true
          description: Null when the caller has no harvest records yet.
        latestProduct:
          type: string
          nullable: true
          description: The product of the most recent harvest record. Null when the caller has no harvest records yet.

    NeedsAttentionResponse:
      type: object
      properties:
        apiariesWithoutHives: { type: integer }
        hivesNeedingInspection: { type: integer }
        inspectionWarningThresholdDays:
          type: integer
          description: >
            The number of days after a hive's latest inspection before
            it's considered to need inspection - configurable on
            inspection-service, defaulting to 14. The same value
            hive-service's own needs_inspection filter uses.

    ErrorResponse:
      type: object
      description: >
        "code" is the stable, machine-readable key: build any localized
        message off of it, not off "message" (an English fallback for logs
        and manual debugging, not meant to be shown to end users).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - missing_authorization
                - invalid_access_token
                - validation_error
                - internal_error
              example: internal_error
            message: { type: string, example: something went wrong }

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [validation_error] }
            message: { type: string, example: request validation failed }
            fields:
              type: object
              description: Field name to error code.
              additionalProperties:
                type: string
                enum:
                  - invalid_limit
