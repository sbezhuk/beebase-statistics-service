# Test-only override for the OLD-vs-NEW HTTP differential harness.
# Applied together with beebase-gateway/docker-compose.dev.yml; never used by
# production Compose or deployment scripts.
services:
  statistics-service:
    environment:
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN}

  subscription-service:
    environment:
      PRO_ENTITLEMENT_ALLOWLIST: ${DIFFERENTIAL_PRO_USER_ID:?set DIFFERENTIAL_PRO_USER_ID}
